<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="CitizenSE – läs, öva och repetera inför medborgarskapsprovet, med material från UHR:s Sverige i fokus."
    />
    <title>CitizenSE – inför medborgarskapsprovet</title>
    <script>
      // Sätt temat innan första målningen så att fel tema aldrig hinner blinka.
      // Samma nyckel och logik som src/theme/theme.ts – håll dem i synk.
      ;(function () {
        try {
          var saved = window.localStorage.getItem('citizense.theme.v1')
          var preference = saved === 'light' || saved === 'dark' || saved === 'system' ? saved : 'system'
          var dark =
            preference === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
              : preference === 'dark'
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
